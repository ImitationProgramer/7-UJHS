[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "guidesense-gait"
version = "0.2.0"
description = "Shared IMU pipeline and dog-independent canine activity classification"
requires-python = ">=3.9"
dependencies = ["numpy==2.0.2", "pandas==2.3.3", "scipy==1.13.1"]

[project.optional-dependencies]
model = ["scikit-learn==1.6.1", "joblib==1.5.3", "threadpoolctl==3.6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
